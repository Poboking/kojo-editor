dialect:
  string_compare_ge_le:
    description: 'String >= and <= operators. ''bug'' = both compiled as (compare < 0) (honke-1824 bug: >= behaves like <, <= behaves like <); ''fixed'' = >= is (c>=0), <= is (c<=0).'
    values:
      v24: bug
      cs_reference: bug
      em_ee: fixed
      snake: fixed
    anchors:
      v24: 'reference/Emuera1824+v24/src1824/Emuera/GameData/Expression/OperatorMethod.cs:487 (c<0), :518 (c<0)'
      cs_reference: 'reference/emuera-cs/MinorShift.Emuera.Runtime.Script.Statements.Expression/OperatorMethodManager.cs:331,367 (both <0; StringComparison.Ordinal)'
      em_ee: 'reference/emuera-em/Emuera/Runtime/Script/Statements/Expression/OperatorMethod.cs:478 (c>=0), :509 (c<=0)'
      snake: 'reference/emuera-skia-4.981/Emuera/Runtime/Script/Statements/Expression/OperatorMethod.cs:547 (c>=0), :578 (c<=0)'
    evidence: 'Differential run 2026-11-10 (SAVETEXT outputs): v24 GE(a,a)=0, GE(a,b)=1, LE(a,a)=0 (bug); em_ee and snake = 1,0,1 (fixed).'
  getnum_nickname_mastername:
    description: 'GETNUM/GETNUMB accept NICKNAME/MASTERNAME keywords iff GetKeywordDictionary has those cases. v24 added them (v23); EM+EE-lineage trees keep only NAME/CALLNAME.'
    values:
      v24: true
      cs_reference: false
      em_ee: false
      snake: false
    keywords:
      routed:
        - NAME
        - CALLNAME
        - RELATION
      gated:
        - NICKNAME
        - MASTERNAME
    anchors:
      v24: 'reference/Emuera1824+v24/src1824/Emuera/GameData/ConstantData.cs:876-877 (NICKNAME/MASTERNAME cases)'
      cs_reference: 'reference/emuera-cs/MinorShift.Emuera.Runtime.Script.Data/ConstantData.cs:1091-1092 (NAME/CALLNAME only)'
      em_ee: 'reference/emuera-em/Emuera/Runtime/Script/Data/ConstantData.cs:1075-1076 (NAME/CALLNAME only)'
      snake: 'reference/emuera-skia-4.981/Emuera/Runtime/Script/Data/ConstantData.cs:1454-1455 (NAME/CALLNAME only)'
    evidence: 'Differential run 2026-11-10 (chara CSV 0 with nick/master ''Ali''): v24 GETNUM(NICKNAME,"Ali") = 0 and GETNUM(MASTERNAME,"Ali") = 0 (found); em_ee and snake both = -1. GETNUM(NAME,"Alice") = 0 in all three.'
  relation_mastername:
    description: 'RELATION reverse-lookup dictionary (relationDic) includes the MASTERNAME column iff the engine registers it. Distinct from getnum_nickname_mastername: EM registers MASTERNAME into relationDic (so RELATION:MASTER:"..." resolves) while its GetKeywordDictionary still has no MASTERNAME case for GETNUM; v24 does both.'
    values:
      v24: true
      cs_reference: false
      em_ee: true
      snake: false
    anchors:
      v24: 'reference/Emuera1824+v24/src1824/Emuera/GameData/ConstantData.cs:640-641 (Mastername added to relationDic)'
      cs_reference: 'reference/emuera-cs/MinorShift.Emuera.Runtime.Script.Data/ConstantData.cs:743-753 (Name/Callname/Nickname only)'
      em_ee: 'reference/emuera-em/Emuera/Runtime/Script/Data/ConstantData.cs:711-712 (Mastername added to relationDic)'
      snake: 'reference/emuera-skia-4.981/Emuera/Runtime/Script/Data/ConstantData.cs:854-863 (Name/Callname/Nickname only)'
    evidence: 'Static source diff 2026-11-11 (relationDic build loops above); no probe run. The gap em_ee true vs getnum_nickname_mastername false is the whole reason this facet exists: EM can read MASTERNAME only through RELATION string subscripts.'
  isnumeric_v24_fix:
    description: 'v24 added LexicalAnalyzer.NumericCheck so ISNUMERIC returns 0 instead of throwing on non-numeric strings. NumericCheck bodies are semantically identical in all four trees (v24/em_ee/snake byte-identical modulo stream type; cs decompile is a switch-form rewrite of the same algorithm). No observable divergence remains.'
    values:
      v24: fixed
      cs_reference: fixed
      em_ee: fixed
      snake: fixed
    anchors:
      v24: 'reference/Emuera1824+v24/src1824/Emuera/GameData/Function/Creator.Method.cs:2545; Sub/LexicalAnalyzer.cs:266'
      cs_reference: 'reference/emuera-cs/MinorShift.Emuera.GameData.Function/FunctionMethodCreator.cs:5765; MinorShift.Emuera.Runtime.Script.Parser/LexicalAnalyzer.cs:167'
      em_ee: 'reference/emuera-em/Emuera/Runtime/Script/Statements/Function/Creator.Method.cs:4754; Runtime/Script/Parser/LexicalAnalyzer.cs:275'
      snake: 'reference/emuera-skia-4.981/Emuera/Runtime/Script/Statements/Function/Creator.Method.cs:6514; Runtime/Script/Parser/LexicalAnalyzer.cs:303'
    evidence: 'Differential run 2026-11-10: ISNUMERIC("123")=1, ("1.2.3")=0, ("0xZZ")=0, ("+")=0, ("")=0 -- identical in v24, em_ee and snake; no CodeEE thrown.'
