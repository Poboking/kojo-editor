name: CI

# push / PR 触发；windows-latest（本项目目标平台 + 平台桥的 Windows 语义）
on:
  push:
  pull_request:

jobs:
  verify:
    name: test / typecheck / audit
    runs-on: windows-latest
    env:
      # CI 使用默认公共 registry。仓库根 .npmrc 固定 npmmirror（仅本机直连可达），
      # 不能带进 CI —— 见下方 Remove local .npmrc 步骤（双保险：env 覆盖 + 删文件）。
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4

      - name: Remove local .npmrc (npmmirror registry is local-only)
        shell: pwsh
        run: Remove-Item -Force .npmrc

      # 不传 version：action 直接读 package.json 的 packageManager 字段（pnpm@11.22.0），
      # 与本地一致。显式传 version 会与 packageManager 冲突直接报错
      # （ERR: Multiple versions of pnpm specified）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # 无游戏目录 → 真实工程集成冒烟/金样本自动跳过（describe.skipIf）
      # 两池必须分开跑：功能用例吃满并行池，墙钟计时用例挤进同一池会互相饿死（CI 随机红的根因）。
      - name: 功能用例（并行池）
        run: pnpm test:unit

      - name: 计时预算用例（串行静默池）
        run: pnpm test:perf

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (@kojo/app)
        run: pnpm --filter @kojo/app typecheck

      - name: Decoupling audit
        run: pnpm audit:decoupling

  # Rust 侧（Tauri 宿主 IO 原语）独立并行闸：不塞进 verify 前面拖慢它。
  # 本机基线 2026-10-17 实测：128 tests（123 passed / 5 ignored）。
  rust:
    name: cargo test --lib (tauri host)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 缓存走本仓库已验证的形态（release.yml 同一枚 action）：target 目录数 GB 级，
      # 手写 actions/cache 会把整棵 target 塞进单一 bucket、撞 10GB 配额。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      # 必须经 node 起 cargo：Git-Bash 直跑有 TMP 环境变量坑（docs/PITFALLS.md），
      # 且与 AGENTS.md §三 验证矩阵口径一致。
      - name: cargo test --lib
        run: node -e "require('child_process').execSync('cargo test --lib',{cwd:'packages/app/src-tauri',stdio:'inherit'})"
