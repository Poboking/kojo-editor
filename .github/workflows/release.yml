# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包），
# 并额外产出绿色版 portable zip（exe + README + LICENSE）与 SHA256SUMS.txt。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      # 同 ci.yml：tree-sitter-cli 的 postinstall 偶发 504，发版这一步更要扛住
      # （tag 已经推出去，装依赖失败会让整个 release 空跑）。pnpm install 幂等，重试两轮。
      - name: install frontend dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "pnpm install failed (attempt $attempt/3), retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          exit 1

      # K2-RELEASE-AUTOMATION（设计稿 §16.10 R9.5–R9.7）：发布前的**机器面快速闸**——
      # 三处 version 逐字一致（root package.json / packages/app/package.json /
      # packages/app/src-tauri/tauri.conf.json）+ 双 typecheck + 解耦审计 + conformance，
      # 逐项读数一次成型，rc≠0 就不再往下打 tag 构建。
      # 只点这 5 项：两池（unit/perf）、app 构建、cargo 的重活已分别由 CI 的 verify 与 rust
      # job 跑过，这里重复只会拖长 tag 构建并放大超时面（红线：构建仍归 release.yml，
      # 不在这里复制第二份发版流水线）。
      # 全量档（version-sync + 两池 + artifact-audit + cargo-test）由发版人手跑或夜间 job 跑：
      #   node tools/release-gate.mjs --release --json
      - name: Release gate（发版前机器面）
        run: node tools/release-gate.mjs --only=version-sync,typecheck-root,typecheck-app,audit,conformance

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。**v0.4.3-beta.1 预发布版**——自 v0.4.2 正式版以来的功能预览，欢迎试用与回报；预发布版**不进入稳定版自动更新通道**。

            ## 下载与安装
            - **Windows 10/11（x64）安装版**：下载本页的 `*_x64-setup.exe`，双击安装。
            - **绿色版**：下载本页的 `*_x64-portable.zip`，解压即用，不写注册表、不建开始菜单。
            - `SHA256SUMS.txt` 附安装包与绿色版的校验值。
            - 本版为预发布：`releases/latest` 仍指向 **v0.4.2**，稳定版自动更新不会收到本 beta；试用请手动下载本页版本，已装 v0.4.2 的用户不受影响。

            ## 本版重点（v0.4.2 → v0.4.3-beta.1）
            - **AI 接入（MCP，默认关闭）**——新增本地 MCP 服务：只监听 127.0.0.1 动态端口，Bearer token + Origin 双闸，独立的第四张授权表（read / edit / privileged 三级 + 会话审批 + 审计 + token 轮换 / 撤销）。冻结契约 v1 提供 33 个以只读为主的 tools、8 个 `kojo://project/*` 资源与 3 个 prompt 骨架；设置页「AI 接入」可开关、授权、查审计，附 Codex / DeepSeek Harness / 通用三份客户端样例。未启用时零字节进开机图。
            - **MCP 真壳端到端取证**——真桌面壳 + 真实 stdio shim 跑通 12/12，并修掉两处分层测试抓不到的接缝缺陷：SSE 应答的 `event:` 行污染 stdout、三个 list 回裸数组导致规范形状不符且 Rust 侧 tier / 特权二次过滤整条跳过。**写类与危险工具仍显式 `NOT_WIRED`**，绝不挂空串假实现。
            - **自动更新完善**——应用常开 4 小时定时重查、更新完成接「立即重启」真通道、检查看门狗 / 会话去重 / 进度节流 / 病因透传、changelog 行内富文本与发标链路静态守卫。
            - **项目级变量引用**——`Shift+F12` 可在 `#DIM` 全局变量上查整个工程（变量腿自成一趟切段）；补上归一化真源、提及位置、旧盘重扫与非等长折叠的形状门修复。
            - **数值看板（右侧侧拉）**——写口上时随手翻查变量字典、项目符号、指令速查与反查引用；真机取证 21 族 / 3,931 名、指令表 222 条、符号页 117,123 函数。
            - **字体档位与调试宿**——设置页新增 30 款开源字体的行内折叠选择器；快速打开文件兜底、打开项目的状态裁决修掉慢盘假 FAIL。
            - **稳定与验证面**——市场面板中文排序改码元序（消掉英文 CI runner 上的稳定红）、快照热载计时量具跟上 v18 元组、启动器 env 探针改成逐项点名的允许集；发版闸门产物上界按 190 提交的功能增量逐笔归因重钉。

            ## 已知事项
            - **预发布版**：功能面广且含默认关闭的实验能力，边界问题欢迎提 Issue；长期写作请照常留备份。
            - **MCP 的边界**：写类与危险工具（`fileTree.*` / `problems.quickFix` / `diff.compare` / `state.replay` / `preview.document`）按 ADR-0013 刻意不接线；sampling / elicitation / resources-subscribe / progress 四项 P5 能力只写了方向、未实现；不含跨机 TLS，stdio shim 需本机桌面壳在跑。
            - Kojo 2.0 仍在切流期：跨档切换后语言面与配色需重载窗口才完整生效（设置页会如实提示，不会静默）；一键迁移对真实语料的迁移率约 27%，其余条目维持拦下。
            - 首次进项目若派生快照未命中，仍会有一次十几秒的全量扫描（已归因；稳态 2–3 秒）。
            - 只提供 **Windows x64**（NSIS 安装包 + 绿色版），安装包**未做代码签名**，SmartScreen 可能提示；绿色版依赖系统 WebView2（Windows 11 自带，Windows 10 可能需 Evergreen 运行时）。
            - 启动器只管理**用户自备**的游戏目录，不分发游戏本体；游戏插件会改盘上文件，安装前请看清清单与备份提示。
            - 仓库与安装包**不包含任何游戏内容**——首次启动选择本机已安装的游戏目录，只读浏览始终可用。
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/main/LICENSE)
          releaseDraft: false
          # 预发布判定：标签名含 '-'（如 v0.4.3-beta.1）即 prerelease，
          # 避免 beta 抢占 releases/latest 的稳定自动更新通道；正式版（如 v0.4.2）仍为稳定发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 绿色版：裸 exe + README + LICENSE 打成便携 zip；顺手给安装包与 zip 出 SHA256。
      - name: package portable zip and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "kojo-editor_${version}_x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "packages/app/src-tauri/target/release/kojo-editor.exe" "$stage/kojo-editor.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $portableReadme = @(
            "kojo-editor v${version} 绿色版",
            "",
            "1. 双击 kojo-editor.exe 运行。",
            "2. 首次启动选择本机 eraTW 游戏目录；不授予写权限也可浏览、校验、回放。",
            "3. 本版不写注册表、不建开始菜单；升级时下载新版 zip 覆盖即可。",
            "4. 需要系统 WebView2 运行时（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。",
            "",
            "仓库：https://github.com/Poboking/kojo-editor",
            "许可证：GPL-3.0-or-later"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$stage/README-PORTABLE.txt", $portableReadme, (New-Object System.Text.UTF8Encoding($false)))
          $zip = "kojo-editor_${version}_x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $setup = "packages/app/src-tauri/target/release/bundle/nsis/kojo-editor_${version}_x64-setup.exe"
          $lines = foreach ($f in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          # LF 行尾，保证 Linux / Git-Bash 的 sha256sum -c 可直接校验（CRLF 会把 \r 当文件名）。
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      # tauri-action 先建 release 并上传安装包/updater 资产；这里补传绿色版与校验值。
      - name: upload portable zip and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" kojo-editor_*_x64-portable.zip SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready (attempt $attempt), retrying..."
            sleep 5
          done
          echo "failed to upload portable assets" >&2
          exit 1
