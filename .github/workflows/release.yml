# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包），
# 并额外产出绿色版 portable zip（exe + README + LICENSE）与 SHA256SUMS.txt。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。**v0.4.2-beta.2 预发布版**——自 v0.4.2-beta.1 以来的功能预览，欢迎试用与回报；预发布版不进入稳定版自动更新通道。

            ## 下载与安装
            - **Windows 10/11（x64）安装版**：下载本页的 `*_x64-setup.exe`，双击安装。
            - **绿色版**：下载本页的 `*_x64-portable.zip`，解压即用，不写注册表、不建开始菜单。
            - `SHA256SUMS.txt` 附安装包与绿色版的校验值。
            - 本版为预发布：`releases/latest` 仍指向 v0.4.1，稳定版自动更新不会收到本 beta；试用请手动下载本页版本。

            ## 本版更新（v0.4.2-beta.1 → v0.4.2-beta.2）
            - **Kojo 2.0 预览通道（默认关）**——设置页新增「Kojo 2.0 档位」三态：默认「只认 v1」，行为与上一版一字不差；想试新写法切「双轨」（老 `.kojo` 一行不动，新 `.kojo2` 走 2.0）或「2.0 默认」。命令面板另有「打开 Kojo 2.0 迁移向导」，逐文件迁移、可撤销，迁不动的会明确拦下而不是硬改。
            - **撤销栈不再被清空**——磁盘重载、外部改动合并、切换行尾、保存前整理、批量替换、💡 一键修复这六条程序化改写全部走统一的撤销上栈通道，作者的历史不会因为一次机器改写整段消失。
            - **查找与替换**——查找词与三个开关按文件跨会话留存（重启不再被开项目首拍洗成空）、「查找词优先」三档进设置页、检索面板「最近检索」可用 ↑/↓ 回溯、全角半角折叠、glob 文件过滤、逐项跳转不再抢焦点、命中显示「第 X 项 / 共 Y 项」。
            - **只读与写权限**——写权限申请被拒即退回只读并给出「重新选择这个文件夹」的出路；被拒过的目录里保存按钮不再按得动；状态栏行尾读数取文件真值，LF/CRLF 可一键切换并按文件记住覆盖位。
            - **`.kojo 预览` 面一批收口**——悬停 / Peek / 查找引用 / `$` 标签按源文件与真实坐标作答，幻影结果与假行号一起修掉；预览面不再把派生投影的结构红线挂到正常 ERB 上；预览面上的写类操作一律给出「切回原文」出路。
            - **诊断一个口径**——状态栏、问题面板、文件树读同一份计数，严重度配色单源；项目级扫描账上屏（没打开的文件也进账）并给文件树单行徽标；错误全文可 hover 复原与展开。
            - **中文与输入法**——输入法合成期与补全互斥（Enter / Esc / Tab 归输入法）；中文函数名的转到定义、悬停、查找引用接上同一把 Unicode 取词尺；补全的拼音键改可检索键并集。
            - **外观与易用**——主题预览卡 + 跟随系统；命令面板按类分组并稳定快捷键列；缩略图三态偏好与界面字号缩放；活动栏只编排当前项目的面板；外部改动冲突从「一个裸数字 + 只能放弃」升级成能看差异。
            - **ERB 结构层**——新增正式 `erb-syntax-tree` 语法包与独立 Worker，折叠/大纲可由语法层供数（真语料 3,980 份 / 412 万行零误报零崩溃）；本版默认关，作为后续结构能力的底座。
            - **条件与校验**——CASE 多行值列表 `{…}` 行连接、`1pN` 位字面量、`SIF` 尾逗号全部收口（未解析残余 13 → 0）；表达式级波浪线的真语料假阳性收口。
            - **自动更新**——检查更新跟随系统环境代理（`HTTPS_PROXY` / `HTTP_PROXY` / `ALL_PROXY`），代理网络下不再直接判失败；未设置代理时行为与上一版一字不差。
            - **新建项目**——多一枚「起手写法」语言档（糖 / 原生），新建口上文件时按选择落起手模板。
            - **内置教程**——多一本《Kojo 2.0 语言教程》（欢迎页第四张卡）：从「你现在用的是哪一档」讲到五锚点、声明区、叙事、条件链、`# 表`/`# 池`/`# 模`、调度与演出、程序层（循环/数组/跳转/函数）、`@原生` 逃生舱，最后一节教读错误与一键迁移；「语法全表」附录同步补上 2.0 的锚点表、`@` 家族表、声明表、等待与空行表，以及旧写法 → 2.0 的逐行对照表（38 行一格没减）。老那本「.kojo 语言教程」讲的还是默认档（v1）的写法，一句没删，只在开头把两本的分工说清。

            ## 已知事项
            - Kojo 2.0 仍在切流期：默认「只认 v1」；跨档后语言面与配色需重载窗口才完整生效（设置页会如实提示，不会静默）；一键迁移对真实语料的迁移率约 27%，其余条目维持拦下。
            - 首次进项目若派生快照未命中，仍会有一次十几秒的全量扫描（已归因；稳态 2–3 秒）。
            - 预发布版：功能面广、部分为默认关的实验能力，可能仍有边界问题，欢迎提 Issue。
            - 仓库与安装包**不包含任何游戏内容**——首次启动选择本机已安装的游戏目录，只读浏览始终可用；
            - 绿色版依赖系统 WebView2（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）；
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/main/LICENSE)
          releaseDraft: false
          # 预发布判定：标签名含 '-'（如 v0.4.2-beta.2）即 prerelease，
          # 避免 beta 抢占 releases/latest 的稳定自动更新通道；正式版（如 v0.4.2）仍为稳定发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 绿色版：裸 exe + README + LICENSE 打成便携 zip；顺手给安装包与 zip 出 SHA256。
      - name: package portable zip and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "kojo-editor_${version}_x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "packages/app/src-tauri/target/release/kojo-editor.exe" "$stage/kojo-editor.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $portableReadme = @(
            "kojo-editor v${version} 绿色版",
            "",
            "1. 双击 kojo-editor.exe 运行。",
            "2. 首次启动选择本机 eraTW 游戏目录；不授予写权限也可浏览、校验、回放。",
            "3. 本版不写注册表、不建开始菜单；升级时下载新版 zip 覆盖即可。",
            "4. 需要系统 WebView2 运行时（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。",
            "",
            "仓库：https://github.com/Poboking/kojo-editor",
            "许可证：GPL-3.0-or-later"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$stage/README-PORTABLE.txt", $portableReadme, (New-Object System.Text.UTF8Encoding($false)))
          $zip = "kojo-editor_${version}_x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $setup = "packages/app/src-tauri/target/release/bundle/nsis/kojo-editor_${version}_x64-setup.exe"
          $lines = foreach ($f in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          # LF 行尾，保证 Linux / Git-Bash 的 sha256sum -c 可直接校验（CRLF 会把 \r 当文件名）。
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      # tauri-action 先建 release 并上传安装包/updater 资产；这里补传绿色版与校验值。
      - name: upload portable zip and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" kojo-editor_*_x64-portable.zip SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready (attempt $attempt), retrying..."
            sleep 5
          done
          echo "failed to upload portable assets" >&2
          exit 1
