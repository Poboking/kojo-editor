# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包），
# 并额外产出绿色版 portable zip（exe + README + LICENSE）与 SHA256SUMS.txt。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # K2-RELEASE-AUTOMATION（设计稿 §16.10 R9.5–R9.7）：发布前的**机器面快速闸**——
      # 三处 version 逐字一致（root package.json / packages/app/package.json /
      # packages/app/src-tauri/tauri.conf.json）+ 双 typecheck + 解耦审计 + conformance，
      # 逐项读数一次成型，rc≠0 就不再往下打 tag 构建。
      # 只点这 5 项：两池（unit/perf）、app 构建、cargo 的重活已分别由 CI 的 verify 与 rust
      # job 跑过，这里重复只会拖长 tag 构建并放大超时面（红线：构建仍归 release.yml，
      # 不在这里复制第二份发版流水线）。
      # 全量档（version-sync + 两池 + artifact-audit + cargo-test）由发版人手跑或夜间 job 跑：
      #   node tools/release-gate.mjs --release --json
      - name: Release gate（发版前机器面）
        run: node tools/release-gate.mjs --only=version-sync,typecheck-root,typecheck-app,audit,conformance

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。**v0.4.2 正式版**——v0.4.1 之后的第一个稳定版，进入稳定自动更新通道。

            ## 下载与安装
            - **Windows 10/11（x64）安装版**：下载本页的 `*_x64-setup.exe`，双击安装。
            - **绿色版**：下载本页的 `*_x64-portable.zip`，解压即用，不写注册表、不建开始菜单。
            - `SHA256SUMS.txt` 附安装包与绿色版的校验值。
            - 已装 v0.4.1 的用户可在「设置 → 更新」里直接升级；两个 beta 的改动全部包含在本版内。

            ## 本版重点（v0.4.1 → v0.4.2）
            - **Kojo 2.0 成为默认档**——`.kojo` 默认按 2.0 解析，旧表层语法封存为 `.kojo1`（设置页切到「双轨」或「只认 v1」仍可继续用）。配「`.kojo` → `.kojo1` 交接工具」与逐文件迁移向导，可撤销；迁不动的条目会明确拦下而不是硬改。
            - **启动器（新的顶层模式）**——实例库：一个游戏目录 = 一个实例（可隔离存档与内容），新建向导三步走完，复制进度、信任确认、四类启动错误各给「为什么 + 下一步」。实例详情分「概览 / 内容包 / 存档 / 游戏插件」四屏；游戏插件安装先展示文件清单与风险、先备份、可回滚；另有任务中心与日志。编辑器与启动器共用同一套只读约束：不在游戏目录里改口上以外的文件。
            - **语言面统一**——补全 / 悬停 / 查找引用 / 跳转定义 / 重命名 / 签名帮助 / 折叠 / 代码操作 / 行上注解 / 语义着色全部改成「判据住插件、宿主只做装配与翻译」。ERB 与 2.0 现在走同一条腿，不再各答一套；新增语言能力也不再往宿主塞分支。
            - **编辑体验**——文件树支持会话剪贴板（复制 / 剪切 / 粘贴，冲突有问句、脏文件有闸）、树内拖拽搬运、批量删除逐条点名 + 一键撤销回原位、行虚拟化与「在此文件夹中搜索」；编辑器组支持跨组拖拽、`Ctrl+1..4` 聚焦、分隔条键盘调整，布局与比例完整落盘、切项目不再丢；命令面板新增 Search Everywhere（双击 Shift 呼出）。
            - **性能与内存**——真语料冷开「进项目到能用」比修复前快约 7×（让位 / 索引可用 / Monaco 挂载三段各从 ~26–28s 降到秒级）；内存分多批压过，冷建稳态 −47.3%、热载稳态累计约 −45%（每批同语料 A/B，读数在仓库 `docs/STATE.md`）；kojo2 结构层并入单 worker 池，折叠与语义诊断改批量派发。
            - **市场与项目**——发布向导支持普通 ZIP 口上包导入（旧 zip 自动补信息、同链上传），成功即生成市场审核单；口上项目工作区的部署 / 导出 / 许可条款收进共享实现。
            - **外观与教程**——浮层 / 按钮 / 边缘 / 右键菜单收成三档美学资产；主题预览卡与跟随系统；新增《Kojo 2.0 语言教程》与「语法全表」2.0 附录（锚点表、`@` 家族、声明表、等待与空行表、旧写法 → 2.0 逐行对照）。

            ## 已知事项
            - Kojo 2.0 仍在切流期：跨档切换后语言面与配色需重载窗口才完整生效（设置页会如实提示，不会静默）；一键迁移对真实语料的迁移率约 27%，其余条目维持拦下。
            - 首次进项目若派生快照未命中，仍会有一次十几秒的全量扫描（已归因；稳态 2–3 秒）。
            - 启动器只管理**用户自备**的游戏目录，不分发游戏本体；游戏插件会改盘上文件，安装前请看清清单与备份提示。
            - 仓库与安装包**不包含任何游戏内容**——首次启动选择本机已安装的游戏目录，只读浏览始终可用。
            - 绿色版依赖系统 WebView2（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/main/LICENSE)
          releaseDraft: false
          # 预发布判定：标签名含 '-'（如 v0.4.2-beta.2）即 prerelease，
          # 避免 beta 抢占 releases/latest 的稳定自动更新通道；正式版（如 v0.4.2）仍为稳定发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 绿色版：裸 exe + README + LICENSE 打成便携 zip；顺手给安装包与 zip 出 SHA256。
      - name: package portable zip and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "kojo-editor_${version}_x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "packages/app/src-tauri/target/release/kojo-editor.exe" "$stage/kojo-editor.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $portableReadme = @(
            "kojo-editor v${version} 绿色版",
            "",
            "1. 双击 kojo-editor.exe 运行。",
            "2. 首次启动选择本机 eraTW 游戏目录；不授予写权限也可浏览、校验、回放。",
            "3. 本版不写注册表、不建开始菜单；升级时下载新版 zip 覆盖即可。",
            "4. 需要系统 WebView2 运行时（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。",
            "",
            "仓库：https://github.com/Poboking/kojo-editor",
            "许可证：GPL-3.0-or-later"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$stage/README-PORTABLE.txt", $portableReadme, (New-Object System.Text.UTF8Encoding($false)))
          $zip = "kojo-editor_${version}_x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $setup = "packages/app/src-tauri/target/release/bundle/nsis/kojo-editor_${version}_x64-setup.exe"
          $lines = foreach ($f in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          # LF 行尾，保证 Linux / Git-Bash 的 sha256sum -c 可直接校验（CRLF 会把 \r 当文件名）。
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      # tauri-action 先建 release 并上传安装包/updater 资产；这里补传绿色版与校验值。
      - name: upload portable zip and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" kojo-editor_*_x64-portable.zip SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready (attempt $attempt), retrying..."
            sleep 5
          done
          echo "failed to upload portable assets" >&2
          exit 1
