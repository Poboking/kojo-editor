# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包），
# 并额外产出绿色版 portable zip（exe + README + LICENSE）与 SHA256SUMS.txt。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。**v0.4.2-beta.1 预发布版**——自 v0.4.1 以来的功能预览，欢迎试用与回报；预发布版不进入稳定版自动更新通道。

            ## 下载与安装
            - **Windows 10/11（x64）安装版**：下载本页的 `*_x64-setup.exe`，双击安装。
            - **绿色版**：下载本页的 `*_x64-portable.zip`，解压即用，不写注册表、不建开始菜单。
            - `SHA256SUMS.txt` 附安装包与绿色版的校验值。
            - 本版为预发布：`releases/latest` 仍指向 v0.4.1，稳定版自动更新不会收到本 beta；试用请手动下载本页版本。

            ## 本版更新（v0.4.1 → v0.4.2-beta.1）
            - **eraAkumaMaid 适配器（新游戏）**——继 eraTW 之后接入第二部作品：脚手架、函数中文化、检索/监听、增减直写、面表 10→22、剧情线预设；内核仍零游戏知识。
            - **tree-sitter 语法层**——新增 `kojo-syntax-tree` 语法包与结构解析叠层（独立 Worker、默认关、fail-open 回落），为大纲/折叠/结构导航铺路。
            - **ERB 语言服务**——`$` 标签查找引用与重命名（全有或全无）、`#DIM` 转定义 + 查找引用、补全触发字符补 `@`/`$`、函数名候选显示定义处原拼写。
            - **编辑器体感批**——大文件面包屑走索引快路、切档不丢导航面、`Ctrl+P` 一栏四用、Peek 覆盖未打开文件、前进/后退导航与恢复关闭标签、转到行、编辑器组布局持久化 + 上下分屏。
            - **检索与补全增强**——检索替换保留大小写、glob 文件过滤、命中文件流式增量、打字即搜、文件历史任意两版互比；补全新增模糊族三档 + 内嵌 GB2312 拼音表让中文候选可检索。
            - **问题面板与 quick fix**——按文件分组/过滤/行内修复/复制消息；quick fix 先出 diff 预览确认才落盘；格式化规则逐条可配。
            - **`.kojo` 语言**——分支规则池（条件即注解、自动排序 + 强制兜底）、删写回建议并补基础库函数字典。
            - **条件矩阵 v2**——面板重做、按包看缺口、erb/kojo 一键填空、工作区包视图与首开提速。
            - **稳定与性能**——watcher 失效自愈（指数退避重连 + 可见态）、崩溃取证落盘 + 单实例锁、批操作快照与备份回收站字节上限、model 池有界冷档 LRU、条件抽取整链 offload 进 worker。

            ## 已知事项
            - 预发布版：功能面广、部分为默认关的实验能力（如 tree-sitter 叠层），可能仍有边界问题，欢迎提 Issue。
            - eraAkumaMaid 适配为新增能力，覆盖面与 eraTW 尚不完全对齐。
            - 仓库与安装包**不包含任何游戏内容**——首次启动选择本机已安装的游戏目录，只读浏览始终可用；
            - 绿色版依赖系统 WebView2（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）；
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/master/LICENSE)
          releaseDraft: false
          # 预发布判定：标签名含 '-'（如 v0.4.2-beta.1）即 prerelease，
          # 避免 beta 抢占 releases/latest 的稳定自动更新通道；正式版（如 v0.4.2）仍为稳定发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 绿色版：裸 exe + README + LICENSE 打成便携 zip；顺手给安装包与 zip 出 SHA256。
      - name: package portable zip and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "kojo-editor_${version}_x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "packages/app/src-tauri/target/release/kojo-editor.exe" "$stage/kojo-editor.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $portableReadme = @(
            "kojo-editor v${version} 绿色版",
            "",
            "1. 双击 kojo-editor.exe 运行。",
            "2. 首次启动选择本机 eraTW 游戏目录；不授予写权限也可浏览、校验、回放。",
            "3. 本版不写注册表、不建开始菜单；升级时下载新版 zip 覆盖即可。",
            "4. 需要系统 WebView2 运行时（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。",
            "",
            "仓库：https://github.com/Poboking/kojo-editor",
            "许可证：GPL-3.0-or-later"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$stage/README-PORTABLE.txt", $portableReadme, (New-Object System.Text.UTF8Encoding($false)))
          $zip = "kojo-editor_${version}_x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $setup = "packages/app/src-tauri/target/release/bundle/nsis/kojo-editor_${version}_x64-setup.exe"
          $lines = foreach ($f in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          # LF 行尾，保证 Linux / Git-Bash 的 sha256sum -c 可直接校验（CRLF 会把 \r 当文件名）。
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      # tauri-action 先建 release 并上传安装包/updater 资产；这里补传绿色版与校验值。
      - name: upload portable zip and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" kojo-editor_*_x64-portable.zip SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready (attempt $attempt), retrying..."
            sleep 5
          done
          echo "failed to upload portable assets" >&2
          exit 1
