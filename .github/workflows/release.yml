# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包），
# 并额外产出绿色版 portable zip（exe + README + LICENSE）与 SHA256SUMS.txt。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。**正式版**。

            ## 下载与安装
            - **Windows 10/11（x64）安装版**：下载本页的 `*_x64-setup.exe` 安装包，双击安装；安装后「设置 → 更新」可一键检查并安装后续版本。
            - **绿色版**：下载本页的 `*_x64-portable.zip`，解压即用，不写注册表、不建开始菜单；更新时重新下载新版即可。
            - `SHA256SUMS.txt` 附安装包与绿色版的校验值。

            ## 本版更新
            - **口上市场**——浏览 / 安装 / 更新口上包与字典包；工作区或普通 ZIP 一键发布，上传前本地预校验，成功后生成市场审核单；
            - **条件矩阵**——全项目「状态·时机 × 事件·面」矩阵，格子显示命中函数数，点击直达；中日对照，十万函数虚拟滚动；
            - **语法全表（附录）**——`.kojo` 写法、取值、编译产物与写错提示一张表查完，教程内可跳转；
            - **补全增强**——ERB 指令 / 变量族 / `#DIM` / 用户函数 / `$标签` / `.kojo` 原生区跨装配补全；停手即弹、延迟可调，台词与注释不打扰；
            - **编辑体验**——分屏、标签栏、面包屑、查找引用 / 重命名 / 跳实现、签名帮助、行内实参提示、三主题、无边框窗口、自动保存与崩溃恢复；
            - **.kojo 语言**——控制流中文写形、数据表、随机、选项、演出、别名与插值继续扩展；校验可中断；
            - **性能与稳定**——索引、首屏、面板长列表与保存链路优化；操作级撤销、回收站、三方合并与写允许域继续收紧。

            ## 已知事项
            - 仓库与安装包**不包含任何游戏内容**——首次启动选择本机已安装的 eraTW 游戏目录，只读浏览始终可用；
            - 绿色版依赖系统 WebView2（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）；
            - 自动更新走 GitHub Releases；网络受限时请手动下载新版；
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/master/LICENSE)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 绿色版：裸 exe + README + LICENSE 打成便携 zip；顺手给安装包与 zip 出 SHA256。
      - name: package portable zip and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "kojo-editor_${version}_x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "packages/app/src-tauri/target/release/kojo-editor.exe" "$stage/kojo-editor.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $portableReadme = @(
            "kojo-editor v${version} 绿色版",
            "",
            "1. 双击 kojo-editor.exe 运行。",
            "2. 首次启动选择本机 eraTW 游戏目录；不授予写权限也可浏览、校验、回放。",
            "3. 本版不写注册表、不建开始菜单；升级时下载新版 zip 覆盖即可。",
            "4. 需要系统 WebView2 运行时（Windows 11 自带；Windows 10 可能需安装 Evergreen 运行时）。",
            "",
            "仓库：https://github.com/Poboking/kojo-editor",
            "许可证：GPL-3.0-or-later"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$stage/README-PORTABLE.txt", $portableReadme, (New-Object System.Text.UTF8Encoding($false)))
          $zip = "kojo-editor_${version}_x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $setup = "packages/app/src-tauri/target/release/bundle/nsis/kojo-editor_${version}_x64-setup.exe"
          $lines = foreach ($f in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          # LF 行尾，保证 Linux / Git-Bash 的 sha256sum -c 可直接校验（CRLF 会把 \r 当文件名）。
          [System.IO.File]::WriteAllText("SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      # tauri-action 先建 release 并上传安装包/updater 资产；这里补传绿色版与校验值。
      - name: upload portable zip and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" kojo-editor_*_x64-portable.zip SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready (attempt $attempt), retrying..."
            sleep 5
          done
          echo "failed to upload portable assets" >&2
          exit 1
