# 发布工作流：push v* tag 时构建 NSIS 安装包 + updater 产物（latest.json + 签名包）。
# 注意：本仓库为私有仓库，GitHub release 资产未经认证不可直链下载，
# updater endpoint（releases/latest/download/latest.json）正式发版前需公开仓库或另配下载代理。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri -> target

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: "kojo-editor v__VERSION__"
          releaseBody: |
            era 口上作者的结构感知编辑器。本发行版为 **测试版（beta）**：核心功能已可用，欢迎试用与反馈。

            ## 下载与安装
            - **Windows 10/11（x64）**：下载下方 `kojo-editor_<版本>_x64-setup.exe`，双击安装。
            - 安装包带更新签名；安装后「设置 → 更新」可一键检查并安装后续版本，无需重装。

            ## 它能做什么
            - **结构化浏览**——口上文件按角色归类，函数按「角色 → 家族 → 面」成树展开，条件徽章一目了然，点击直达；
            - **约定校验**——函数名拼写、家族完整性、格式问题列成清单，点击跳到出错行，错误不再静默；
            - **.kojo 语言**——`如果 好感度 ≤ 5：` 这样的中文语感写口上，保存时自动编译为游戏原样读取的脚本，原编码、原换行一字不乱；
            - **状态回放**——选一份存档一个角色，每条触发条件的真假与分支走向直接铺开，不用开游戏刷状态；
            - **状态注入**——数值改动写入测试存档，两步确认、自动备份、回读验证，真实存档与游戏本体永远只读；
            - **自动更新**——应用内一键检查并安装后续版本。

            ## 已知事项
            - 仓库与安装包**不包含任何游戏内容**——首次启动需选择本机已安装的 eraTW 游戏目录，只读浏览始终可用；
            - beta 阶段功能与界面仍会调整；网络环境需能访问 GitHub Releases（自动更新走同一路径）；
            - 遇到问题欢迎[提交 Issue](https://github.com/Poboking/kojo-editor/issues)。

            开发者：[Poboking](https://github.com/Poboking) ｜ 许可证：[GPL-3.0-or-later](https://github.com/Poboking/kojo-editor/blob/master/LICENSE)
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
