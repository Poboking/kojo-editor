[package]
name = "kojo-editor"
version = "0.1.0"
description = "kojo-editor desktop shell (Tauri host)"
authors = ["Poboking"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kojo_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 修复：tauri-build → schemars 0.8.22(preserve_order) → indexmap 1.9.3 链上无人启用
# indexmap 的 "std" feature（它不是默认 feature！），no_std 分支的
# `IndexMap<K, V, S>` 无默认参数，schemars 的 `Map<K,V> = IndexMap<K,V>`
# 在 rustc 1.99 下报 E0107。显式启用 std → feature"或"语义强制该编译单元带 std。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
walkdir = "2"
rfd = "0.15"
notify = "8.2.0"
tauri-plugin-updater = "2"
# 全文检索的匹配器（正则 / 字面量 / 全词 / 大小写四个口径合成一份 pattern）。
# 已经躺在 tauri 依赖树里（Cargo.lock 既有 regex 1.13），提为直接依赖不新增编译单元。
regex = "1"
# 市场 IO 原语（远程下载 + ZIP 安全解压）。reqwest 0.13.5 / zip 4.6.1 已因
# tauri-plugin-updater 躺在 Cargo.lock 里（Windows 上 reqwest 的唯一宿主就是它），
# 提为直接依赖不新增编译单元。feature 逐条对齐 updater 的口径（default-features = false）：
# rustls-no-provider ⇒ provider 由宿主装（见 market.rs::ensure_tls_provider）。
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# 发布通道（2026-10-16 发布批）的上传流需要 async 文件读（tokio::fs::File + AsyncReadExt）。
# tokio 已因 tauri 躺在 Cargo.lock 里，提为直接依赖不新增编译单元；只点 fs/io-util 两个 feature。
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }
# zip 只取 deflate-flate2：默认 feature 的 "deflate" 还带 zopfli（**不在 Cargo.lock 里**，
# 会新增编译单元）；解压只需要 flate2 解码路径。
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
# **必须自己点 flate2 的后端**：zip 的 `deflate-flate2` 只做 `dep:flate2`、不选 backend，
# 而 zip 侧声明 flate2 时 `default-features = false`；Windows 上 updater 的 flate2 依赖是
# linux/macos target-gated（`tauri-plugin-updater-2.13.3/Cargo.toml:166,174`），feature 域里
# 无人启用 rust_backend ⇒ flate2 直接 `compile_error!("No compression backend selected")`。
# miniz_oxide 0.9.1 / adler2 / simd-adler32 已在 Cargo.lock（png → flate2 默认链）里。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# 发布上传的容器摘要（后端强制 `x-market-zip-sha256` 头：sha256 of 实际上传的 zip 原始字节）。
# sha2 0.10 已因 rustls 系依赖躺在 Cargo.lock 里，提为直接依赖不新增编译单元。
sha2 = "0.10"
# 单实例锁（P0-4）：官方插件（Windows 走 identifier 命名的互斥体 + 命名管道通知）。
# 第二实例起即发现已有实例 → 通知主进程（回调里聚焦主窗口）→ 立即退出，不弹 Web UI。
tauri-plugin-single-instance = "2"
# Win32 绑定：CreateProcessW 的 STARTUPINFOW / JOBOBJECT_EXTENDED_LIMIT_INFORMATION 这类
# 结构体自己按 repr(C) 抄一遍容易静默错位，宁可吃现成绑定。
# 2026-10-26 启动器 L3a：从 **dev-dependencies 提到 dependencies**——启动器宿主
# （`src/launcher/`）是生产路径（Job Object / 挂起创建 / 进程存活查询），不再只是探针。
# 不新增编译单元：windows-sys 0.61.2 早已因 tauri 栈躺在 Cargo.lock 里；feature 集与
# 探针时期逐条相同（探针 `src/launcher_probe.rs` 也吃同一份）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
