<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kojo-editor · 口上编辑器</title>
    <!-- 主题早应用（主题系统 2026-10-17；2026-10-27 扩到六档）：React 挂载前就把保存过的主题
         落到 <html data-theme>，免得非缺省档用户先闪一下深色。真源与归一口径同 `ui/theme-pref.ts`
         （读不到/非法 ⇒ dark）。⚠ 这份白名单必须与 `THEME_IDS` 手动同步——内联脚本里不能 import，
         所以只能手抄；'system' 不在此列（早应用不知道系统深浅，折 dark，挂载后立刻改写）。
         漏一项的后果不是报错，而是那一档用户每次开机都先看一段深蓝灰引导。
         dark 是缺省档，此时下面的引导底色 #1e2227 仍与 styles.css 的 --bg 相等——smoke-tauri-dom
         断言①钉的那条不变量不被破坏。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kojo.ui.theme.v1');
          var known = ['light', 'mint-dark', 'one-dark', 'rose-pine', 'synthwave84'];
          document.documentElement.setAttribute(
            'data-theme',
            known.indexOf(t) >= 0 ? t : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- L1-A 内联引导层（2026-10-16 首屏批）：React 挂载前窗口里先画这一层，替代 WebView 默认白。
         底色 #1e2227 必须与 styles.css 的 --bg 现值一致——由 tools/smoke-tauri-dom.mjs 断言①
         钉住「内联底色 == 挂载后计算底色」，两处漂移即红。深色、零外链资源（dev 下 styles.css
         由 JS 注入，这里等不了它）。React 首次提交后由 App.tsx 移除 #boot-splash。
         ⚠ 浅色/薄荷引导层取色见下方 [data-theme] 覆盖——三档 × 五面（--bg / --fg / --fg-dim /
         --bg-3 / --accent）须逐字等于该档主题源现值，清单真源照 themes/light.css 顶部「锚定不变量」。
         这条散文警告现由 packages/app/tests/boot-sweep-single-source.test.ts 逐字镜像钉住：漂了即红。 -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e2227;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 底色这一格不参与边缘装饰（单源闸钉住它 == --bg）：质感全走下面的伪元素 */
        background: #1e2227;
        color: #d7dce2;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Noto Sans CJK SC', sans-serif;
      }
      /* 启动窗边缘（与 React 启动层的 .boot-screen::before/::after 同构）：
         内圈发丝线 + 顶缘品牌光 + 品牌锁上方极淡的 accent 辉光。 */
      #boot-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(115% 85% at 50% -20%, rgba(76, 139, 245, 0.16), transparent 64%);
        box-shadow:
          inset 0 0 0 1px #3a424b,
          inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }
      #boot-splash::after {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 1px;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(76, 139, 245, 0.5) 16%,
          rgba(76, 139, 245, 0.75) 50%,
          rgba(76, 139, 245, 0.5) 84%,
          transparent
        );
      }
      .boot-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .boot-splash-lock {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boot-splash-mark {
        width: 26px;
        height: 26px;
        flex: none;
        color: #4c8bf5;
      }
      .boot-splash-name {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot-splash-ver {
        font-size: 12px;
        color: #909aa4;
        letter-spacing: 0.02em;
      }
      .boot-splash-tip {
        font-size: 12px;
        color: #909aa4;
      }
      /* 右上角唯一控件：退出。静止时与背景同色，只在悬停 / 按下变红底（形态与
         React 启动层 window-chrome.css 同构）；焦点环内收，不向外画压 UI 的方框。 */
      #boot-splash-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        box-shadow: none;
        color: #909aa4;
        font: inherit;
        line-height: 1;
        cursor: default;
        transition:
          background-color 140ms ease-out,
          border-color 140ms ease-out,
          color 140ms ease-out,
          box-shadow 140ms ease-out;
      }
      #boot-splash-close svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      #boot-splash-close:hover {
        background: #e06c75;
        border-color: #e06c75;
        color: #fff;
        box-shadow:
          0 0 0 3px rgba(224, 108, 117, 0.2),
          0 6px 16px rgba(224, 108, 117, 0.32);
      }
      #boot-splash-close:active {
        background: #e06c75;
        border-color: #f0a5ac;
        color: #fff;
        box-shadow: 0 0 0 2px rgba(224, 108, 117, 0.26);
      }
      #boot-splash-close:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #5b9aff;
      }
      .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: #2b3138;
        overflow: hidden;
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #4c8bf5;
        animation: boot-sweep 1.15s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      /* 扫光条是「进程指示物」而非装饰动效。2026-10-18 用户反馈 2：系统
         `prefers-reduced-motion` 常是假阳性（如 Windows「调整为最佳性能」预设），扫光条一旦
         停下就只剩一条"固定不动"的光带，反被读成卡死 ⇒ **豁免系统通道**：用 !important 重声明
         时长 / 次数压过全局压平那条；真正的无障碍开关是应用内的「减弱动效」（见 styles.css）。 */
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          animation-duration: 1.15s !important;
          animation-iteration-count: infinite !important;
        }
      }
      /* 引导层跟随主题（底色/文字须与对应 themes/*.css 的 --bg/--fg 现值一致，见上方注释） */
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f6f8fa;
      }
      html[data-theme='light'] #boot-splash {
        background: #f6f8fa;
        color: #1f2328;
      }
      html[data-theme='light'] .boot-splash-tip {
        color: #59636e;
      }
      html[data-theme='light'] .boot-splash-mark {
        color: #0a5cc2;
      }
      html[data-theme='light'] .boot-splash-ver {
        color: #59636e;
      }
      html[data-theme='light'] #boot-splash::before {
        background: radial-gradient(115% 85% at 50% -20%, rgba(10, 92, 194, 0.1), transparent 64%);
        box-shadow:
          inset 0 0 0 1px #d0d7de,
          inset 0 1px 0 rgba(255, 255, 255, 0.65);
      }
      html[data-theme='light'] #boot-splash::after {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(10, 92, 194, 0.4) 16%,
          rgba(10, 92, 194, 0.62) 50%,
          rgba(10, 92, 194, 0.4) 84%,
          transparent
        );
      }
      html[data-theme='light'] #boot-splash-close {
        color: #59636e;
      }
      html[data-theme='light'] #boot-splash-close:hover {
        background: #b4232e;
        border-color: #b4232e;
        color: #fff;
        box-shadow:
          0 0 0 3px rgba(180, 35, 46, 0.16),
          0 6px 16px rgba(180, 35, 46, 0.24);
      }
      html[data-theme='light'] #boot-splash-close:active {
        background: #b4232e;
        border-color: #d05a63;
        color: #fff;
        box-shadow: 0 0 0 2px rgba(180, 35, 46, 0.2);
      }
      html[data-theme='light'] #boot-splash-close:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #0969da;
      }
      html[data-theme='light'] .boot-bar {
        background: #dde3ea;
      }
      html[data-theme='light'] .boot-bar::after {
        background: #0a5cc2;
      }
      html[data-theme='mint-dark'],
      html[data-theme='mint-dark'] body {
        background: #0f1713;
      }
      html[data-theme='mint-dark'] #boot-splash {
        background: #0f1713;
        color: #d9e9df;
      }
      html[data-theme='mint-dark'] .boot-splash-tip {
        color: #88a896;
      }
      html[data-theme='mint-dark'] .boot-splash-mark {
        color: #35d0a0;
      }
      html[data-theme='mint-dark'] .boot-splash-ver {
        color: #88a896;
      }
      html[data-theme='mint-dark'] #boot-splash::before {
        background: radial-gradient(115% 85% at 50% -20%, rgba(53, 208, 160, 0.16), transparent 64%);
        box-shadow:
          inset 0 0 0 1px #2b3f35,
          inset 0 1px 0 rgba(205, 255, 232, 0.05);
      }
      html[data-theme='mint-dark'] #boot-splash::after {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(53, 208, 160, 0.5) 16%,
          rgba(53, 208, 160, 0.75) 50%,
          rgba(53, 208, 160, 0.5) 84%,
          transparent
        );
      }
      html[data-theme='mint-dark'] #boot-splash-close {
        color: #88a896;
      }
      html[data-theme='mint-dark'] #boot-splash-close:hover {
        background: #e2707a;
        border-color: #e2707a;
        color: #072118;
        box-shadow:
          0 0 0 3px rgba(226, 112, 122, 0.22),
          0 6px 16px rgba(226, 112, 122, 0.3);
      }
      html[data-theme='mint-dark'] #boot-splash-close:active {
        background: #e2707a;
        border-color: #f0a5ac;
        color: #072118;
        box-shadow: 0 0 0 2px rgba(226, 112, 122, 0.26);
      }
      html[data-theme='mint-dark'] #boot-splash-close:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #45d9ab;
      }
      html[data-theme='mint-dark'] .boot-bar {
        background: #1c2a23;
      }
      html[data-theme='mint-dark'] .boot-bar::after {
        background: #35d0a0;
      }
      /* ---- 2026-10-27 经典编辑器色三套：五面（--bg/--fg/--fg-dim/--bg-3/--accent）与
         各自的 themes/*.css 逐字相等，由 boot-sweep-single-source.test.ts 比对 ---- */
      html[data-theme='one-dark'],
      html[data-theme='one-dark'] body {
        background: #282c34;
      }
      html[data-theme='one-dark'] #boot-splash {
        background: #282c34;
        color: #b8bfca;
      }
      html[data-theme='one-dark'] .boot-splash-tip {
        color: #a0a9b2;
      }
      html[data-theme='one-dark'] .boot-splash-mark {
        color: #61afef;
      }
      html[data-theme='one-dark'] .boot-splash-ver {
        color: #a0a9b2;
      }
      html[data-theme='one-dark'] #boot-splash::before {
        background: radial-gradient(115% 85% at 50% -20%, rgba(97, 175, 239, 0.1), transparent 64%);
        box-shadow:
          inset 0 0 0 1px #3b4048,
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      html[data-theme='one-dark'] #boot-splash::after {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(97, 175, 239, 0.4) 16%,
          rgba(97, 175, 239, 0.62) 50%,
          rgba(97, 175, 239, 0.4) 84%,
          transparent
        );
      }
      html[data-theme='one-dark'] #boot-splash-close {
        color: #a0a9b2;
      }
      html[data-theme='one-dark'] #boot-splash-close:hover {
        background: #e8838c;
        border-color: #e8838c;
        color: #282c34;
        box-shadow:
          0 0 0 3px rgba(232, 131, 140, 0.22),
          0 6px 16px rgba(232, 131, 140, 0.3);
      }
      html[data-theme='one-dark'] #boot-splash-close:active {
        background: #e8838c;
        border-color: #f2a7ae;
        color: #282c34;
        box-shadow: 0 0 0 2px rgba(232, 131, 140, 0.26);
      }
      html[data-theme='one-dark'] #boot-splash-close:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #7cc4ff;
      }
      html[data-theme='one-dark'] .boot-bar {
        background: #333944;
      }
      html[data-theme='one-dark'] .boot-bar::after {

      }
      html[data-theme='rose-pine'],
      html[data-theme='rose-pine'] body {
        background: #191724;
      }
      html[data-theme='rose-pine'] #boot-splash {
        background: #191724;
        color: #e0def4;
      }
      html[data-theme='rose-pine'] .boot-splash-tip {
        color: #9a95b8;
      }
      html[data-theme='rose-pine'] .boot-splash-mark {

      }
      html[data-theme='rose-pine'] .boot-splash-ver {

      }
      html[data-theme='rose-pine'] #boot-splash::before {
        background: radial-gradient(115% 85% at 50% -20%, rgba(196, 167, 231, 0.16), transparent 64%);
        box-shadow:
          inset 0 0 0 1px #2a2740,
          inset 0 1px 0 rgba(255, 240, 245, 0.05);
      }
      html[data-theme='rose-pine'] #boot-splash::after {
        background: linear-gradient(
          90deg,
          transparent,

          rgba(196, 167, 231, 0.75) 50%,
          rgba(196, 167, 231, 0.5) 84%,

        );
      }
      html[data-theme='rose-pine'] #boot-splash-close {

      }
      html[data-theme='rose-pine'] #boot-splash-close:hover {

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-card" data-tauri-drag-region>
        <!-- 品牌锁：logo + 字标 + 版本。版本由 vite.config.ts 的 transformIndexHtml 从
             packages/app/package.json 注入——与 React 启动弹窗同一条单一真源，不写死。 -->
        <div class="boot-splash-lock">
          <svg
            class="boot-splash-mark"
            viewBox="0 0 16 16"
            fill="currentColor"
            fill-rule="evenodd"
            aria-hidden="true"
            focusable="false"
            data-tauri-drag-region
          >
            <path d="M3 1.6h10a2.4 2.4 0 0 1 2.4 2.4v5a2.4 2.4 0 0 1-2.4 2.4H7.3L4 14.1v-2.7H3A2.4 2.4 0 0 1 .6 9V4A2.4 2.4 0 0 1 3 1.6Zm1.45 4.9a1.05 1.05 0 1 0 2.1 0 1.05 1.05 0 1 0-2.1 0Zm2.5 0a1.05 1.05 0 1 0 2.1 0 1.05 1.05 0 1 0-2.1 0Zm2.5 0a1.05 1.05 0 1 0 2.1 0 1.05 1.05 0 1 0-2.1 0Z" />
          </svg>
          <span class="boot-splash-name" data-tauri-drag-region>kojo-editor</span>
          <span class="boot-splash-ver" data-tauri-drag-region>v%KOJO_APP_VERSION%</span>
        </div>
        <div class="boot-splash-tip">正在启动…</div>
        <div class="boot-bar"></div>
      </div>
      <!-- 启动弹窗唯一的控件：退出。React 挂载前也能用：Tauri 的 IPC 已注入，
           命令名与窗口权限同 `core:window:allow-close`；浏览器 dev 里静默无效。 -->
      <button
        type="button"
        id="boot-splash-close"
        aria-label="退出应用"
        title="退出应用"
        onclick="try{window.__TAURI_INTERNALS__.invoke('plugin:window|close',{label:'main'})}catch(e){}"
      >
        <!-- 与 React 侧 Icon name="close" 同一路径 / 线宽：撤罩换手时叉形不跳 -->
        <svg
          class="boot-splash-x"
          viewBox="0 0 16 16"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        ><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
    </div>
    <!-- L1-0 引导标记（parse 期落盘，main.tsx 收编进 __kojoPerf；口径见 src/perf.ts bootMark）：
         - htmlParsed：本脚本执行时刻 = 引导层标记已进 DOM（≈可见），自导航起点 ms；
         - bgAtParse：parse 期 body 计算底色（断言①的内联样本，与挂载后计算值比对钉漂移）；
         - t500：t+500ms 采样（断言①备选支「≤500ms 内 #root 非空」）；
         - raf1：首帧 rAF 时刻（firstPaint 的近似回退）。
         另：dev（vite 直服）把资源时间线缓冲放大——monaco 图 ~1338 模块，默认 250 条会把
         早期请求挤掉，令「欢迎页可点前不得有 monaco 请求」的断言假绿（详 smoke-tauri-dom）。 -->
    <script>
      (function () {
        var m = (window.__kojoBootMarks = window.__kojoBootMarks || {});
        try {
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            performance.setResourceTimingBufferSize(6000);
          }
        } catch (e) {
          /* 旧内核不支持就算了：断言侧按缓冲内可见条目判定，不因放大失败而挂 */
        }
        m.htmlParsed = performance.now();
        m.bgAtParse = getComputedStyle(document.body).backgroundColor;
        requestAnimationFrame(function () {
          if (m.raf1 === undefined) m.raf1 = performance.now();
        });
        setTimeout(function () {
          m.t500 = {
            at: performance.now(),
            rootChildren: document.getElementById('root').childElementCount,
            bg: getComputedStyle(document.body).backgroundColor,
            splash: !!document.getElementById('boot-splash'),
          };
        }, 500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
